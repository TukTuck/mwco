<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MWCO — Kartentisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0d12;
    --canvas:#07090d;
    --grid-dot:#1a222d;
    --glass:rgba(16,22,30,.55);
    --glass-strong:rgba(14,19,26,.72);
    --edge:rgba(150,175,205,.13);
    --edge-strong:rgba(150,175,205,.22);
    --win:rgba(13,18,25,.78);
    --text:#e7ecf3;
    --text-dim:#93a0b4;
    --text-faint:#5d6b80;

    --paul:#8b6dff;
    --webchat:#3fb6f5;
    --terminal:#3ecf8e;
    --logs:#f5a524;
    --orch:#f56d8b;
    --tausch:#4dd0c4;
    --blur:blur(14px) saturate(1.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---------- Statusleiste oben ---------- */
  #topbar{
    position:fixed;top:10px;left:56px;right:56px;height:38px;z-index:90;
    display:flex;align-items:center;gap:14px;padding:0 14px;
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:12px;
  }
  #topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  #topbar .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--paul);box-shadow:0 0 10px var(--paul)}
  #topbar .sep{width:1px;height:18px;background:var(--edge-strong)}
  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
  .stat .sd{width:6px;height:6px;border-radius:50%}
  .stat .sd.on{background:var(--terminal);box-shadow:0 0 6px var(--terminal)}
  .stat .sd.wait{background:var(--logs)}
  #topbar .grow{flex:1}
  .vrammini{display:flex;align-items:center;gap:7px}
  .vrammini .bar{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
  .vrammini .bar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--paul),var(--orch));border-radius:3px}
  .vrammini .t{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint)}
  #paulbtn{
    display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9px;cursor:pointer;
    background:color-mix(in srgb,var(--paul) 14%,transparent);border:1px solid color-mix(in srgb,var(--paul) 35%,transparent);
    color:#cabdff;font-size:11.5px;font-weight:600;
  }
  #paulbtn img{width:16px;height:16px;border-radius:5px;object-fit:cover}
  #paulbtn kbd{font-family:'JetBrains Mono',monospace;font-size:9px;color:#8f7fd6;background:rgba(0,0,0,.3);padding:2px 5px;border-radius:4px}
  #clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint)}

  /* ---------- Tisch ---------- */
  #surface{
    position:absolute;left:56px;top:64px;right:56px;bottom:56px;
    background-color:var(--canvas);
    background-image:radial-gradient(circle,var(--grid-dot) 1.2px,transparent 1.2px);
    background-size:24px 24px;
    border:1px solid var(--edge);
    border-radius:18px;
    box-shadow:inset 0 0 110px rgba(0,0,0,.55);
    overflow:hidden;cursor:grab;transition:border-color .2s;
  }
  #surface.panning{cursor:grabbing}
  #surface.hot{border-color:color-mix(in srgb,var(--paul) 60%,transparent)}
  #world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}

  /* ---------- Karten: Glas ---------- */
  .tile{
    position:absolute;width:96px;height:96px;
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-top:3px solid var(--c);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:grab;z-index:5;overflow:hidden;transition:box-shadow .16s,background .16s;
  }
  .tile:hover{background:rgba(24,32,43,.6);box-shadow:0 8px 26px rgba(0,0,0,.55)}
  .tile.dragging{cursor:grabbing;box-shadow:0 18px 44px rgba(0,0,0,.65);z-index:50}
  .tile .icon{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);
    border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
  .tile .icon img{width:100%;height:100%;object-fit:cover;border-radius:8px}
  .tile .name{font-weight:600;font-size:11px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tile.open{width:252px;height:auto;align-items:stretch;justify-content:flex-start;padding:12px;gap:8px}
  .tile.open .head{display:flex;align-items:center;gap:9px}
  .tile.open .name{font-size:13px;max-width:none;padding:0}
  .tile.open .tag{margin-left:auto;font-size:9px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
  .tile.open .info{font-size:10.5px;color:var(--text-faint)}
  .tile.open .rows{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--edge);padding-top:8px}
  .row{display:flex;align-items:center;gap:8px;font-size:10.5px}
  .row .k{font-family:'JetBrains Mono',monospace;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .grow{flex:1}
  .badge{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
  .badge.on{color:var(--terminal);background:color-mix(in srgb,var(--terminal) 14%,transparent)}
  .badge.wait{color:var(--logs);background:color-mix(in srgb,var(--logs) 14%,transparent)}
  .mini-msg{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;color:var(--text-dim)}
  .mini-msg .who{width:18px;height:18px;border-radius:6px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
  .mini-msg .txt{background:rgba(10,14,20,.6);border:1px solid var(--edge);border-radius:8px;padding:5px 8px;max-width:190px;overflow:hidden;line-height:1.4}
  .tile.open .note{font-size:9.5px;color:var(--text-faint);text-align:center;padding-top:2px}
  .portrait{display:flex;align-items:center;gap:10px}
  .portrait img{width:52px;height:52px;border-radius:12px;object-fit:cover;border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .portrait .pname{font-weight:700;font-size:13px}
  .portrait .psub{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace}
  .vram{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:2px}
  .vram .vbar{height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));border-radius:4px}
  .vlabel{font-size:9.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace}

  /* ---------- Fenster: Glas ---------- */
  .win{position:absolute;background:var(--win);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--edge-strong);border-top:3px solid var(--c);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.7);z-index:20}
  .win.dragging{z-index:60;opacity:.94}
  .win-head{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:9px;padding:0 13px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--edge);cursor:grab}
  .win-head .sw{width:9px;height:9px;border-radius:4px;background:var(--c)}
  .win-head .title{font-weight:600;font-size:13px}
  .win-head .tag{font-size:10px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 8px;border-radius:5px;font-weight:600}
  .win-head .grow{flex:1}
  .ctl{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;font-size:12px;transition:.12s}
  .ctl:hover{background:rgba(255,255,255,.07);color:var(--text)}
  .win-body{flex:1;overflow:auto;padding:14px;min-height:0}

  .taskcard{background:rgba(255,255,255,.03);border:1px solid var(--edge);border-radius:11px;padding:11px 13px;margin-bottom:10px}
  .taskcard .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
  .taskcard .t .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .taskcard .d{color:var(--text-dim);font-size:11.5px;line-height:1.5;margin-top:6px}
  .taskcard .steps{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .step{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--text-dim)}
  .step .cb{width:14px;height:14px;border-radius:4px;border:1px solid var(--edge-strong);flex:0 0 14px;display:flex;align-items:center;justify-content:center;font-size:9px}
  .step.done .cb{background:color-mix(in srgb,var(--terminal) 22%,transparent);border-color:var(--terminal);color:var(--terminal)}
  .step.done{color:var(--text-faint)}

  .chat-input{display:flex;align-items:center;gap:8px;margin-top:10px}
  .chips{display:flex;gap:5px}
  .chip{font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid var(--edge);color:var(--text-faint);cursor:pointer}
  .chip.on{color:var(--paul);border-color:var(--paul);background:color-mix(in srgb,var(--paul) 10%,transparent)}
  .chat-input input{flex:1;background:rgba(10,14,20,.6);border:1px solid var(--edge);border-radius:9px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:12.5px}
  .chat-input input:focus{outline:none;border-color:var(--paul)}
  .chat-input button{background:var(--paul);border:none;border-radius:9px;width:36px;height:34px;color:#fff;cursor:pointer;font-size:15px}

  .term{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:#c4cfdd}
  .term .p{color:var(--terminal)}
  .term .c{color:var(--text-faint)}
  .logs{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.9}
  .logs .lvl{display:inline-block;width:52px;font-weight:600}
  .logs .info{color:var(--webchat)}
  .logs .ok{color:var(--terminal)}
  .logs .warn{color:var(--logs)}
  .tbl{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:11px}
  .tbl td{padding:5px 6px;border-bottom:1px solid var(--edge);color:var(--text-dim)}
  .tbl td:first-child{color:var(--text)}

  .ghost{position:absolute;border:1.5px dashed var(--paul);border-radius:12px;background:color-mix(in srgb,var(--paul) 6%,transparent);pointer-events:none;z-index:40}

  /* ---------- Paul-Launcher ---------- */
  #launcher{
    position:fixed;left:50%;top:16%;transform:translateX(-50%);width:580px;z-index:200;
    background:var(--glass-strong);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid var(--edge-strong);border-radius:16px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 0 1px color-mix(in srgb,var(--paul) 18%,transparent);
    display:none;
  }
  #launcher.show{display:block;animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateX(-50%) translateY(-8px) scale(.98);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
  #launcher .lin{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--edge)}
  #launcher .lin img{width:26px;height:26px;border-radius:8px;object-fit:cover}
  #launcher .lin input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:inherit}
  #launcher .lin input:focus{outline:none}
  #launcher .lin kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-faint);border:1px solid var(--edge);padding:3px 6px;border-radius:5px}
  #launcher .sugg{padding:6px}
  .sug{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--text-dim);font-size:12.5px}
  .sug .si{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
  .sug .sk{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-faint)}
  .sug:hover,.sug.sel{background:rgba(255,255,255,.05);color:var(--text)}
  #launcher .lfoot{padding:8px 16px;border-top:1px solid var(--edge);font-size:10px;color:var(--text-faint);display:flex;gap:14px}

  /* ---------- HUD / Tip ---------- */
  #hud{
    position:fixed;right:18px;bottom:18px;z-index:100;display:flex;align-items:center;gap:2px;
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #hud button{width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #hud button:hover{background:rgba(255,255,255,.07);color:var(--text)}
  #hud .pct{min-width:48px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);cursor:pointer;padding:4px 2px;border-radius:7px}
  #hud .pct:hover{background:rgba(255,255,255,.07);color:var(--text)}
  #tip{position:fixed;left:18px;bottom:18px;z-index:100;color:var(--text-faint);font-size:11px;
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:10px;padding:7px 12px}
  #tip b{color:var(--text-dim);font-weight:600}

  /* ---------- eckiger ---------- */
  #surface{border-radius:10px}
  .tile{border-radius:6px}
  .tile .icon{border-radius:5px}
  .tile .icon img{border-radius:4px}
  .win{border-radius:8px}
  #topbar{border-radius:8px}
  #hud{border-radius:6px}
  #hud button{border-radius:5px}
  #hud .pct{border-radius:5px}
  #tip{border-radius:6px}
  #launcher{border-radius:10px}
  #launcher .lin img{border-radius:6px}
  #launcher .lin kbd{border-radius:4px}
  .sug{border-radius:6px}
  .sug .si{border-radius:6px}
  .taskcard{border-radius:7px}
  .portrait img{border-radius:6px}
  .badge{border-radius:3px}
  .chip{border-radius:4px}
  .ctl{border-radius:5px}
  .mini-msg .txt{border-radius:6px}
  .mini-msg .who{border-radius:5px}
  .chat-input input{border-radius:6px}
  .chat-input button{border-radius:6px}
  .step .cb{border-radius:3px}
  .vram{border-radius:3px}
  .vram .vbar{border-radius:3px}
  .vrammini .bar{border-radius:3px}
  .vrammini .bar i{border-radius:3px}

  /* ---------- Verbindungslinien ---------- */
  #wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #wires path{fill:none;stroke:rgba(150,175,205,.16);stroke-width:1.5;stroke-dasharray:5 7}
  #wires path.flow{stroke:var(--wc);stroke-width:2;stroke-dasharray:8 6;animation:wireflow .6s linear infinite;filter:drop-shadow(0 0 5px var(--wc))}
  @keyframes wireflow{to{stroke-dashoffset:-14}}
</style>
</head>
<body>

  <div id="topbar">
    <div class="logo"><div class="dot"></div>MWCO</div>
    <div class="sep"></div>
    <div class="stat"><span class="sd on"></span>Hub verbunden</div>
    <div class="stat"><span class="sd on"></span>Tailscale</div>
    <div class="stat"><span class="sd wait"></span>2 Worker</div>
    <div class="grow"></div>
    <div class="vrammini"><div class="bar"><i></i></div><span class="t">5.4/8 GB</span></div>
    <div class="sep"></div>
    <div id="paulbtn"><img src="assets/paul.png">Paul<kbd>Ctrl ⇧ P</kbd></div>
    <div id="clock">--:--</div>
  </div>

  <div id="surface"><div id="world"></div></div>

  <div id="launcher">
    <div class="lin"><img src="assets/paul.png"><input id="linq" placeholder="Paul fragen oder Befehl…"><kbd>ESC</kbd></div>
    <div class="sugg" id="sugg"></div>
    <div class="lfoot"><span>↑↓ wählen</span><span>↵ ausführen</span><span>Paul läuft lokal · Qwen 7B</span></div>
  </div>

  <div id="tip"><b>Doppelklick</b> Karte = auf/zu · <b>rausziehen</b> = Fenster · <b>Fläche ziehen</b> = pannen · <b>Scrollrad</b> = zoomen</div>
  <div id="hud">
    <button id="zout">−</button><div class="pct" id="zpct">100%</div><button id="zin">＋</button><button id="zfit">⌂</button>
  </div>

<script>
const TYPES = {
  paul:{c:'var(--paul)',name:'Paul',sub:'MCP-Bridge · Qwen 7B',icon:'P',img:'assets/paul.png',tag:'MCP',w:470,h:470,
    rows:'msgs', preview:[['P','Ich bin verbunden. 9 Tools aktiv.'],['Ich','Zeig die laufenden Tasks.']],
    body:`
      <div class="taskcard"><div class="t"><span class="dot" style="background:var(--orch)"></span>Laufende Tasks vom Orchestrator</div>
        <div class="d">3 offen, 1 läuft. Soll ich sie hier reinholen?</div>
        <div class="steps">
          <div class="step done"><span class="cb">✓</span>Verbunden mit MCP-Bus</div>
          <div class="step done"><span class="cb">✓</span>Modell geladen (7B Q4)</div>
          <div class="step"><span class="cb"></span>Tasks anzeigen</div>
        </div></div>
      <div class="chat-input"><div class="chips"><span class="chip on">Auto</span><span class="chip">Free</span><span class="chip">Code</span></div><input placeholder="Paul fragen…"/><button>↑</button></div>`},
  llm:{c:'var(--paul)',name:'LLM-Routen',sub:'OmniRoute · lokal + API',icon:'',img:'assets/paul.png',tag:'router',w:450,h:430,
    rows:'llm',
    body:`
      <div class="portrait"><img src="assets/paul.png"><div><div class="pname">Paul</div><div class="psub">Qwen2.5-7B · Q4_K_M</div></div></div>
      <div class="vram" style="margin-top:10px"><div class="vbar" style="width:68%"></div></div>
      <div class="vlabel">5.4 / 8 GB VRAM belegt</div>
      <table class="tbl" style="margin-top:10px">
        <tr><td>paul → 7B lokal</td><td>llama.cpp</td><td><span class="badge on">AKTIV</span></td></tr>
        <tr><td>orch → 1.5B lokal</td><td>llama.cpp</td><td><span class="badge on">AKTIV</span></td></tr>
        <tr><td>webchat → claude</td><td>api · key ✓</td><td><span class="badge on">AKTIV</span></td></tr>
        <tr><td>webchat → gpt</td><td>api · key ✗</td><td><span class="badge wait">KEIN KEY</span></td></tr>
        <tr><td>stt → whisper</td><td>whisper.cpp</td><td><span class="badge wait">WARTET</span></td></tr></table>`},
  tausch:{c:'var(--tausch)',name:'Austausch',sub:'6/7 Instanzen aktiv',icon:'⇄',tag:'mesh',w:440,h:340,
    rows:'tbl', previewT:[['185.220.101.7','on'],['45.148.10.99','on'],['94.130.110.143','wait']],
    body:`<table class="tbl">
      <tr><td>185.220.101.7</td><td>relay</td><td><span class="badge on">AKTIV</span></td></tr>
      <tr><td>45.148.10.99</td><td>exit</td><td><span class="badge on">AKTIV</span></td></tr>
      <tr><td>94.130.110.143</td><td>relay</td><td><span class="badge wait">WARTUNG</span></td></tr>
      <tr><td>116.202.95.16</td><td>bridge</td><td><span class="badge on">AKTIV</span></td></tr></table>`},
  webchat:{c:'var(--webchat)',name:'WebChat',sub:'Claude · kein MCP',icon:'◈',tag:'kein MCP',w:420,h:340,
    rows:'msgs', preview:[['C','Gerne, hier ein Entwurf…']],
    body:`<div style="display:flex;gap:6px;margin-bottom:10px"><span class="chip on">Claude</span><span class="chip">ChatGPT</span><span class="chip">Gemini</span></div>
      <div style="border:1px dashed var(--edge-strong);border-radius:10px;height:calc(100% - 70px);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:12px;text-align:center">Reines Chat-Interface.<br/>Kein MCP, kein System-Zugriff.</div>`},
  terminal:{c:'var(--terminal)',name:'Terminal',sub:'bash · ~/mwco',icon:'>_',tag:'',w:440,h:300,
    rows:'term', preview:['git status','npm run build:all'],
    body:`<div class="term"><div><span class="p">~/mwco $</span> git status</div><div class="c">On branch arena/01a0c3a9-mwco</div><div><span class="p">~/mwco $</span> ▊</div></div>`},
  logs:{c:'var(--logs)',name:'Logs',sub:'live · alle Streams',icon:'≡',tag:'',w:410,h:300,
    rows:'logs', preview:[['INFO','mcp.bus connected'],['WARN','orch.vram 91%']],
    body:`<div class="logs"><div><span class="lvl info">INFO</span>mcp.bus connected</div><div><span class="lvl ok">OK</span>paul.model loaded</div><div><span class="lvl warn">WARN</span>orch.vram 91%</div><div><span class="lvl info">INFO</span>task.004 dispatch</div></div>`},
  orch:{c:'var(--orch)',name:'Orchestrator',sub:'Qwen 1.5B · 4 tasks',icon:'✦',tag:'1.5B',w:430,h:320,
    rows:'term', preview:['blueprint → 4 tasks','dispatch an 2 worker'],
    body:`<div class="term"><div><span style="color:var(--orch)">orch</span> blueprint → 4 tasks</div><div class="c">dispatched an 2 worker</div><div><span style="color:var(--orch)">orch</span> monitor aktiv ▊</div></div>`},
};

const surface=document.getElementById('surface');
const world=document.getElementById('world');
const zpct=document.getElementById('zpct');
let ghost=null, view={x:0,y:0,s:1};

function apply(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;
  surface.style.backgroundSize=`${24*view.s}px ${24*view.s}px`;
  surface.style.backgroundPosition=`${view.x}px ${view.y}px`;
  zpct.textContent=Math.round(view.s*100)+'%';
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function zoomAt(cx,cy,f){
  const r=surface.getBoundingClientRect();
  const px=cx-r.left,py=cy-r.top;
  const s2=clamp(view.s*f,.25,2.5), k=s2/view.s;
  view.x=px-k*(px-view.x); view.y=py-k*(py-view.y); view.s=s2; apply();
}
surface.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0012));},{passive:false});
const ctr=()=>{const r=surface.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];};
document.getElementById('zin').onclick=()=>{const[cx,cy]=ctr();zoomAt(cx,cy,1.2);};
document.getElementById('zout').onclick=()=>{const[cx,cy]=ctr();zoomAt(cx,cy,1/1.2);};
document.getElementById('zfit').onclick=()=>{view={x:0,y:0,s:1};apply();};
zpct.onclick=()=>{const[cx,cy]=ctr();zoomAt(cx,cy,1/view.s);};

let pan=null;
surface.addEventListener('pointerdown',e=>{
  if(e.target!==surface&&e.target!==world)return;
  pan={sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y};
  surface.classList.add('panning');surface.setPointerCapture(e.pointerId);
});
surface.addEventListener('pointermove',e=>{if(!pan)return;view.x=pan.ox+(e.clientX-pan.sx);view.y=pan.oy+(e.clientY-pan.sy);apply();});
surface.addEventListener('pointerup',()=>{pan=null;surface.classList.remove('panning');});

const screenToWorld=(px,py)=>{const r=surface.getBoundingClientRect();return{x:(px-r.left-view.x)/view.s,y:(py-r.top-view.y)/view.s};};

const start=[['paul',90,100],['llm',250,130],['tausch',500,70],['webchat',780,170],['terminal',250,360],['logs',570,370],['orch',860,400]];
start.forEach(([k,x,y],i)=>setTimeout(()=>spawnTile(k,x,y),i*60));

function spawnTile(key,x,y){
  const t=TYPES[key];
  const el=document.createElement('div');
  el.className='tile';el.dataset.key=key;el.style.setProperty('--c',t.c);
  el.style.left=x+'px';el.style.top=y+'px';
  renderTile(el,t,false);
  world.appendChild(el);attachTile(el);
}
function renderTile(el,t,open){
  const ic=t.img?`<img src="${t.img}">`:t.icon;
  if(open){
    let inner='';
    if(t.rows==='msgs')inner=t.preview.map(m=>`<div class="mini-msg"><div class="who">${m[0]}</div><div class="txt">${m[1]}</div></div>`).join('');
    if(t.rows==='tbl')inner=t.previewT.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="grow"></span><span class="badge ${r[1]}">${r[1]==='on'?'AKTIV':'WARTUNG'}</span></div>`).join('');
    if(t.rows==='term')inner=t.preview.map(l=>`<div class="row"><span class="k" style="color:var(--terminal)">$</span><span class="k">${l}</span></div>`).join('');
    if(t.rows==='logs')inner=t.preview.map(l=>`<div class="row"><span class="badge ${l[0]==='WARN'?'wait':'on'}">${l[0]}</span><span class="k">${l[1]}</span></div>`).join('');
    if(t.rows==='llm')inner=`
      <div class="portrait"><img src="${t.img}"><div><div class="pname">Paul</div><div class="psub">Qwen2.5-7B · Q4</div></div></div>
      <div class="vram"><div class="vbar" style="width:68%"></div></div>
      <div class="vlabel">5.4 / 8 GB VRAM</div>
      <div class="row"><span class="k">paul → 7B lokal</span><span class="grow"></span><span class="badge on">AKTIV</span></div>
      <div class="row"><span class="k">webchat → gpt</span><span class="grow"></span><span class="badge wait">KEIN KEY</span></div>`;
    el.innerHTML=`<div class="head"><div class="icon">${ic}</div><div class="name">${t.name}</div>${t.tag?`<div class="tag">${t.tag}</div>`:''}</div>
      <div class="info">${t.sub}</div><div class="rows">${inner}</div><div class="note">Doppelklick = zu · rausziehen = Fenster</div>`;
  }else{
    el.innerHTML=`<div class="icon">${ic}</div><div class="name">${t.name}</div>`;
  }
}
function attachTile(el){
  dragTile(el);
  el.addEventListener('dblclick',()=>{
    if(el.classList.contains('dragged-recently'))return;
    renderTile(el,TYPES[el.dataset.key],el.classList.toggle('open'));
  });
}
function dragTile(el){
  let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();drag=true;moved=false;el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;
    showGhost(el);e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4)moved=true;
    el.style.left=(ox+(e.clientX-sx)/view.s)+'px';el.style.top=(oy+(e.clientY-sy)/view.s)+'px';
    moveGhost(el,e.clientX,e.clientY);
  });
  el.addEventListener('pointerup',e=>{
    if(!drag)return;drag=false;el.classList.remove('dragging');hideGhost();
    if(moved){
      el.classList.add('dragged-recently');setTimeout(()=>el.classList.remove('dragged-recently'),250);
      if(!pointInSurface({x:e.clientX,y:e.clientY})){const k=el.dataset.key;el.remove();makeWindow(k,e.clientX,e.clientY);}
    }
  });
}
function makeWindow(key,x,y){
  const t=TYPES[key];
  const el=document.createElement('div');
  el.className='win';el.dataset.key=key;el.style.setProperty('--c',t.c);
  el.style.width=t.w+'px';el.style.height=t.h+'px';
  el.style.left=Math.max(8,x-120)+'px';el.style.top=Math.max(8,y-20)+'px';
  el.innerHTML=`<div class="win-head"><div class="sw"></div><div class="title">${t.name}</div>${t.tag?`<div class="tag">${t.tag}</div>`:''}<div class="grow"></div><div class="ctl dock" title="Zurück als Karte">▣</div><div class="ctl close" title="Schließen">✕</div></div><div class="win-body">${t.body}</div>`;
  document.body.appendChild(el);dragWin(el);
  el.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();el.remove();});
  el.querySelector('.dock').addEventListener('click',e=>{e.stopPropagation();el.remove();const w=screenToWorld(innerWidth/2,innerHeight/2);spawnTile(key,w.x,w.y);});
}
function dragWin(el){
  const head=el.querySelector('.win-head');
  let sx=0,sy=0,ox=0,oy=0,drag=false;
  head.addEventListener('pointerdown',e=>{
    if(e.target.closest('.ctl')||e.target.closest('input'))return;
    drag=true;el.classList.add('dragging');head.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;
    showGhost(el);e.preventDefault();
  });
  head.addEventListener('pointermove',e=>{
    if(!drag)return;
    el.style.left=(ox+e.clientX-sx)+'px';el.style.top=(oy+e.clientY-sy)+'px';
    moveGhost(el,e.clientX,e.clientY);
  });
  head.addEventListener('pointerup',e=>{
    if(!drag)return;drag=false;el.classList.remove('dragging');hideGhost();
    if(pointInSurface({x:e.clientX,y:e.clientY})){
      const k=el.dataset.key;el.remove();
      const w=screenToWorld(e.clientX,e.clientY);
      spawnTile(k,w.x-48,w.y-48);
    }
  });
}
const pointInSurface=pt=>{const r=surface.getBoundingClientRect();return pt.x>r.left&&pt.x<r.right&&pt.y>r.top&&pt.y<r.bottom;};

function showGhost(el){ghost=document.createElement('div');ghost.className='ghost';document.body.appendChild(ghost);}
function moveGhost(el,x,y){
  if(!ghost)return;
  const inside=pointInSurface({x,y});
  surface.classList.toggle('hot',inside);
  const s=el.classList.contains('win')?1:view.s;
  if(inside){
    ghost.style.display='block';
    ghost.style.width=el.offsetWidth*s+'px';ghost.style.height=el.offsetHeight*s+'px';
    ghost.style.left=(x-el.offsetWidth*s/2)+'px';ghost.style.top=(y-el.offsetHeight*s/2)+'px';
  }else ghost.style.display='none';
}
function hideGhost(){if(ghost){ghost.remove();ghost=null;}surface.classList.remove('hot');}

/* ---------- Paul-Launcher ---------- */
const launcher=document.getElementById('launcher');
const linq=document.getElementById('linq');
const SUGG=[
  ['var(--terminal)','>_','Öffne Terminal in ~/mwco','tool'],
  ['var(--orch)','✦','Zeig laufende Tasks vom Orchestrator','paul'],
  ['var(--paul)','P','VRAM-Status: was läuft gerade?','paul'],
  ['var(--tausch)','⇄','Austausch: welche Instanzen sind aktiv?','paul'],
  ['var(--webchat)','◈','Neues WebChat-Fenster (Claude)','tool'],
  ['var(--logs)','≡','Exportiere Logs als Datei','tool'],
];
function renderSugg(q){
  const list=SUGG.filter(s=>s[2].toLowerCase().includes(q.toLowerCase()));
  document.getElementById('sugg').innerHTML=(list.length?list:SUGG).map(s=>
    `<div class="sug" style="--sc:${s[0]}"><div class="si">${s[1]}</div>${s[2]}<span class="sk">${s[3]}</span></div>`).join('');
}
function toggleLauncher(show){
  launcher.classList.toggle('show',show);
  if(show){linq.value='';renderSugg('');setTimeout(()=>linq.focus(),30);}
}
document.getElementById('paulbtn').onclick=()=>toggleLauncher(!launcher.classList.contains('show'));
linq.addEventListener('input',()=>renderSugg(linq.value));
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();toggleLauncher(!launcher.classList.contains('show'));}
  if(e.key==='Escape')toggleLauncher(false);
});

/* ---------- Verbindungslinien (n8n-artig) ---------- */
const WIRES=[
  ['llm','paul','var(--paul)'],
  ['llm','orch','var(--orch)'],
  ['paul','orch','var(--orch)'],
  ['orch','terminal','var(--terminal)'],
  ['paul','tausch','var(--tausch)'],
  ['orch','logs','var(--logs)'],
];
const svgNS='http://www.w3.org/2000/svg';
const wiresSvg=document.createElementNS(svgNS,'svg');
wiresSvg.id='wires';wiresSvg.setAttribute('width','5000');wiresSvg.setAttribute('height','5000');
world.insertBefore(wiresSvg,world.firstChild);
const wirePaths=WIRES.map(w=>{
  const p=document.createElementNS(svgNS,'path');
  p.style.setProperty('--wc',w[2]);
  wiresSvg.appendChild(p);return p;
});
const tileOf=k=>world.querySelector(`.tile[data-key="${k}"]`);
function updateWires(){
  WIRES.forEach((w,i)=>{
    const a=tileOf(w[0]),b=tileOf(w[1]),p=wirePaths[i];
    if(!a||!b){p.style.display='none';return;}
    p.style.display='';
    const acx=a.offsetLeft+a.offsetWidth/2, bcx=b.offsetLeft+b.offsetWidth/2;
    let sx,tx;
    if(bcx>=acx){sx=a.offsetLeft+a.offsetWidth;tx=b.offsetLeft;}
    else{sx=a.offsetLeft;tx=b.offsetLeft+b.offsetWidth;}
    const sy=a.offsetTop+a.offsetHeight/2, ty=b.offsetTop+b.offsetHeight/2;
    const dx=Math.max(30,Math.min(120,Math.abs(tx-sx)*0.4));
    const dir=tx>=sx?1:-1;
    p.setAttribute('d',`M ${sx} ${sy} C ${sx+dx*dir} ${sy}, ${tx-dx*dir} ${ty}, ${tx} ${ty}`);
  });
}
(function wireLoop(){updateWires();requestAnimationFrame(wireLoop);})();
/* Aktivität: zufällige Linie "fließt" */
setInterval(()=>{
  const vis=WIRES.map((w,i)=>i).filter(i=>tileOf(WIRES[i][0])&&tileOf(WIRES[i][1]));
  if(!vis.length)return;
  const p=wirePaths[vis[Math.floor(Math.random()*vis.length)]];
  p.classList.add('flow');setTimeout(()=>p.classList.remove('flow'),1500);
},2200);

/* Uhr */
function tick(){const d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,10000);
apply();
</script>
